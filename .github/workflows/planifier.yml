name: Planifier les sujets
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  planifier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les sujets de la semaine
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/planifier.js
      - name: Sauver le calendrier et le journal
        run: |
          git config user.name "auto-planning-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/calendrier.json content/journal.json
          git commit -m "Planification semaine du $(date +%F)" || echo "rien à committer"
          git push
